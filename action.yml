name: "gbraad's Dotfiles `dotini` Action"
description: 'Wrapper for dotini command execution on GitHub runners'
author: "Gerard Braad <me@gbraad.nl>"
inputs:
  inifile:
    description: 'The dotfiles INI filename'
    required: true
    default: ''
  args:
    description: 'Arguments'
    required: false
    default: ''
  as_user:
    description: 'User to run the commands as (optional)'
    required: false
    default: ""
runs:
  using: 'composite'
  steps:
    - name: Execute dotini command
      uses: gbraad-actions/zsh-action@main
      with:
        as_user: ${{ inputs.as_user }}
        run: |
          # Check if dotini function exists
          if ! type dotini >/dev/null 2>&1; then
            echo "Error: dotini function is not defined. Please make sure to run install first"
            exit 1
          fi
          
          # Execute dotini command
          dotini ${{ inputs.inifile }} ${{ inputs.args }}
